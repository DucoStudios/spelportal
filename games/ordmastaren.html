<link rel="manifest" href="../manifest.json">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spelportal">

<title>Ordmästaren</title>
<style>
  :root {
    --bg: #170F2E; --bg2: #241A44; --panel: #2C1F52; --outline: #120A24;
    --pink: #FF6EC7; --orange: #FF7A3D; --yellow: #FFD23F; --cyan: #2FE6D6; --purple: #8B5CF6;
    --ink: #FFF6FB; --ink-soft: #C9B6E8; --green: #5CB85C; --red: #FF4D5E;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; height: 100dvh; overflow: hidden; overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); font-family: 'Open Sans', -apple-system, sans-serif; color: var(--ink); overscroll-behavior-y: contain; }

  .topbar {
    position: relative; z-index: 5; display: flex; align-items: center; justify-content: space-between;
    padding: 0.6rem 1rem; background: linear-gradient(180deg, #2A1750 0%, #170F2E 100%);
    border-bottom: 3px solid var(--outline);
  }
  .topbar h1 { font-weight: 800; font-size: 1.05rem; margin: 0; }
  .topbar a { font-size: 0.72rem; font-weight: 700; color: var(--cyan); text-decoration: none; }

  #gameWrap { position: relative; width: 100%; height: calc(100% - 44px); height: calc(100dvh - 44px); overflow: hidden; }

  /* ---- Paketval-vy ---- */
  #packView { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 12px 24px; }
  .stat-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 14px; }
  .stat-pill {
    background: rgba(23,15,46,0.8); border: 2px solid var(--outline); border-radius: 10px;
    padding: 0.4rem 0.8rem; font-weight: 800; font-size: 0.82rem; text-align: center;
  }
  .stat-pill .big { display: block; font-size: 1.05rem; }
  .stat-pill.streak { color: var(--orange); }
  .stat-pill.xp { color: var(--yellow); }
  .stat-pill.words { color: var(--cyan); }

  .pack-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; max-width: 640px; margin: 0 auto; }
  .pack-card {
    background: var(--panel); border: 3px solid var(--outline); border-radius: 14px; padding: 10px;
    width: 100%; color: var(--ink); font-family: inherit; text-align: left; cursor: pointer; box-shadow: 4px 4px 0 var(--outline); position: relative;
  }
  .pack-card:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--outline); }
  .pack-card.locked { background: #362A5C; cursor: not-allowed; opacity: 0.65; }
  .pack-card .num { display: block; font-size: 0.68rem; font-weight: 800; color: var(--ink-soft); }
  .pack-card .pack-title { display: block; margin: 2px 0 6px; font-size: 0.86rem; font-weight: 800; line-height: 1.2; }
  .pack-card .bar-bg { display: block; height: 8px; border-radius: 4px; background: rgba(0,0,0,0.35); overflow: hidden; margin-bottom: 6px; }
  .pack-card .bar-fill { display: block; height: 100%; background: var(--cyan); border-radius: 4px; }
  .pack-card .stars { display: block; font-size: 0.85rem; color: var(--yellow); }
  .pack-card .lock-icon { position: absolute; top: 8px; right: 10px; font-size: 1rem; }

  .page-title { text-align: center; font-weight: 900; font-size: 1.1rem; margin: 4px 0 10px; color: var(--yellow); text-shadow: 2px 2px 0 var(--outline); }
  .page-sub { text-align: center; font-size: 0.78rem; color: var(--ink-soft); max-width: 480px; margin: 0 auto 14px; line-height: 1.5; }

  /* ---- Sessions-vy ---- */
  #sessionView { position: absolute; inset: 0; display: none; flex-direction: column; }
  .session-hud { display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
  .session-hud .bar-bg { flex: 1; height: 10px; border-radius: 5px; background: rgba(0,0,0,0.35); overflow: hidden; }
  .session-hud .bar-fill { height: 100%; background: var(--green); border-radius: 5px; transition: width 0.25s; }
  .session-hud .xp-pop { font-weight: 800; font-size: 0.8rem; color: var(--yellow); min-width: 44px; text-align: right; }
  .session-hud .back-btn { background: none; border: none; color: var(--ink-soft); font-size: 1.2rem; cursor: pointer; padding: 0 4px; }

  #cardArea { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 14px; overflow-y: auto; }
  .mode-tag { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.08em; padding: 3px 10px; border-radius: 20px; border: 2px solid var(--outline); }
  .mode-tag.read { background: var(--cyan); color: var(--outline); }
  .mode-tag.listen { background: var(--purple); color: var(--ink); }
  .mode-tag.speak { background: var(--orange); color: var(--outline); }
  .mode-tag.intro { background: var(--yellow); color: var(--outline); }

  .prompt-word { font-size: 2.1rem; font-weight: 900; text-align: center; text-shadow: 2px 2px 0 var(--outline); word-break: break-word; max-width: 90vw; }
  .prompt-gloss { font-size: 1.3rem; font-weight: 700; text-align: center; color: var(--ink-soft); max-width: 90vw; }
  .sound-btn {
    background: var(--panel); border: 3px solid var(--outline); border-radius: 50%; width: 68px; height: 68px;
    font-size: 1.6rem; cursor: pointer; box-shadow: 4px 4px 0 var(--outline); color: var(--ink);
  }
  .sound-btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--outline); }

  .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 420px; }
  .opt-btn {
    background: var(--panel); border: 3px solid var(--outline); border-radius: 12px; padding: 0.7rem 0.5rem;
    font-size: 0.88rem; font-weight: 700; cursor: pointer; box-shadow: 4px 4px 0 var(--outline); color: var(--ink);
  }
  .opt-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--outline); }
  .opt-btn.correct { background: var(--green); color: var(--outline); }
  .opt-btn.wrong { background: var(--red); color: var(--outline); }

  .mic-btn {
    background: var(--orange); border: 4px solid var(--outline); border-radius: 50%; width: 96px; height: 96px;
    font-size: 2.2rem; cursor: pointer; box-shadow: 5px 5px 0 var(--outline); color: var(--outline);
  }
  .mic-btn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--outline); }
  .mic-btn.listening { background: var(--red); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

  .speak-fallback-btn, .skip-btn {
    background: var(--green); border: 3px solid var(--outline); border-radius: 10px; padding: 0.7rem 1.3rem;
    font-size: 0.9rem; font-weight: 800; cursor: pointer; box-shadow: 4px 4px 0 var(--outline); color: var(--outline);
  }
  .skip-btn { background: var(--ink-soft); }
  .speak-fallback-btn:active, .skip-btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--outline); }

  .heard-text { font-size: 0.85rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
  .continue-btn {
    background: var(--yellow); color: var(--outline); border: 3px solid var(--outline); border-radius: 10px;
    padding: 0.75rem 1.6rem; font-size: 0.95rem; font-weight: 800; cursor: pointer; box-shadow: 4px 4px 0 var(--outline);
  }
  .continue-btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--outline); }

  .feedback-flash { font-size: 1rem; font-weight: 800; min-height: 1.4em; text-align: center; }
  .feedback-flash.ok { color: var(--green); }
  .feedback-flash.no { color: var(--red); }

  @keyframes bounceIn { 0% { transform: scale(0.7); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
  .anim-in { animation: bounceIn 0.28s ease-out; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .anim-shake { animation: shake 0.3s ease-in-out; }

  /* ---- Overlays (start/summary) ---- */
  .overlay {
    position: absolute; inset: 0; background: color-mix(in srgb, var(--bg2) 94%, transparent);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.9rem; text-align: center; padding: 1.3rem; z-index: 8; overflow-y: auto;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-weight: 900; font-size: 1.5rem; margin: 0; color: var(--yellow); text-shadow: 2px 2px 0 var(--outline); }
  .overlay p { max-width: 380px; font-size: 0.86rem; font-weight: 600; color: var(--ink-soft); margin: 0; line-height: 1.6; }
  button.cta {
    font-family: 'Open Sans', sans-serif; font-size: 0.9rem; font-weight: 800; text-transform: uppercase;
    background: var(--yellow); color: var(--outline); border: 3px solid var(--outline); border-radius: 8px;
    box-shadow: 4px 4px 0 var(--outline); padding: 0.6rem 1.4rem; cursor: pointer;
  }
  button.cta:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--outline); }
  button.cta.secondary { background: var(--panel); color: var(--ink); }

  .sound-toggle { background: none; border: none; color: var(--ink-soft); font-size: 1.1rem; cursor: pointer; padding: 0 6px; }

  .burst-particle {
    position: fixed; width: 9px; height: 9px; border-radius: 50%; pointer-events: none; z-index: 20;
    animation: burstFly 0.6s ease-out forwards;
  }
  @keyframes burstFly {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.3); opacity: 0; }
  }

  .combo-pop {
    position: fixed; left: 50%; top: 28%; transform: translate(-50%, -50%); z-index: 21; pointer-events: none;
    font-weight: 900; font-size: 1.5rem; color: var(--yellow); text-shadow: 2px 2px 0 var(--outline);
    animation: comboPop 0.75s ease-out forwards; text-align: center; white-space: nowrap;
  }
  @keyframes comboPop {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
    30% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    100% { transform: translate(-50%, -62%) scale(1); opacity: 0; }
  }

  .mastery-banner {
    position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); z-index: 22; pointer-events: none;
    background: var(--yellow); color: var(--outline); border: 4px solid var(--outline); border-radius: 16px;
    padding: 1rem 1.6rem; font-weight: 900; font-size: 1.05rem; text-align: center; box-shadow: 6px 6px 0 var(--outline);
    animation: masteryPop 1.4s ease-out forwards; max-width: 80vw;
  }
  @keyframes masteryPop {
    0% { transform: translate(-50%, -50%) scale(0.6) rotate(-4deg); opacity: 0; }
    15% { transform: translate(-50%, -50%) scale(1.08) rotate(2deg); opacity: 1; }
    25% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
    85% { opacity: 1; }
    100% { transform: translate(-50%, -62%) scale(1); opacity: 0; }
  }
</style>

  // Bygg upp paket-objekt med {fr, sv} istallet for tuples
  PACKS.forEach(p => { p.words = p.words.map(w => ({ fr: w[0], sv: w[1] })); });

  const TOTAL_WORDS = PACKS.reduce((sum, p) => sum + p.words.length, 0);
  const UNLOCK_THRESHOLD = 0.2;  // 20% bemastrat lockar upp nasta paket
  const SESSION_LEN = 14;

  // ================= Progress (localStorage) =================
  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function loadProgress() {
    let p = null;
    try { p = JSON.parse(localStorage.getItem(PROGRESS_KEY)); } catch (e) {}
    if (!p || typeof p !== 'object') p = {};
    if (!p.words) p.words = {};
    if (!p.streak) p.streak = { count: 0, lastDate: null };
    if (typeof p.xp !== 'number') p.xp = 0;
    if (!p.sessionsPlayed) p.sessionsPlayed = new Array(PACKS.length).fill(0);
    return p;
  }
  function saveProgress(p) { localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); }
  let progress = loadProgress();

  function wordState(fr) { return progress.words[fr] || { read: false, listen: false, speak: false }; }
  function wordDoneCount(fr) { const s = wordState(fr); return (s.read ? 1 : 0) + (s.listen ? 1 : 0) + (s.speak ? 1 : 0); }
  function markWordMode(fr, mode) {
    const s = progress.words[fr] || { read: false, listen: false, speak: false };
    const wasMastered = s.read && s.listen && s.speak;
    s[mode] = true;
    progress.words[fr] = s;
    const nowMastered = s.read && s.listen && s.speak;
    return !wasMastered && nowMastered; // true om ordet just nu blev fardigt bemastrat
  }
  // Delkravsbaserad procentsats (summa av lasa/lyssna/tala-status over alla
  // ord, delat pa max mojliga) istallet for "andel helt bemastrade ord" --
  // annars star paketets stapel still pa 0% anda tills forsta ordet klarat
  // ALLA tre lagen, vilket kans oavlonande tidigt i ett paket (ett
  // anvandardtest visade fortfarande 0% efter en hel session,
  // hittades under testning 2026-08-08).
  function packMasteryPct(packIdx) {
    const words = PACKS[packIdx].words;
    let done = 0;
    words.forEach(w => { done += wordDoneCount(w.fr); });
    return done / (words.length * 3);
  }
  function packStars(pct) {
    if (pct >= 0.9) return 3;
    if (pct >= 0.6) return 2;
    if (pct >= 0.3) return 1;
    return 0;
  }
  function isPackUnlocked(packIdx) {
    if (packIdx === 0) return true;
    return packMasteryPct(packIdx - 1) >= UNLOCK_THRESHOLD;
  }
  function totalMasteredWords() {
    let n = 0;
    PACKS.forEach(p => p.words.forEach(w => { if (wordDoneCount(w.fr) === 3) n++; }));
    return n;
  }
  function bumpStreak() {
    const today = todayStr();
    if (progress.streak.lastDate === today) return;
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    if (progress.streak.lastDate === yesterday) progress.streak.count++;
    else progress.streak.count = 1;
    progress.streak.lastDate = today;
    saveProgress(progress);
  }

  // ================= Talsyntes (franska, gemensam naturligare röstmotor) =================
  function speak(text) {
    window.FrenchSpeech?.speak(text, { rate: 0.9 });
  }

  // ================= Taligenkanning (feature-detected) =================
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  const speechRecoSupported = !!SpeechRecognitionCtor;

  function normalizeForMatch(s) {
    return String(s || '').toLowerCase()
      .replace(/œ/g, 'oe')
      .replace(/æ/g, 'ae')
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z]/g, '');
  }
  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    if (m === 0) return n;
    if (n === 0) return m;
    const dp = new Array(n + 1);
    for (let j = 0; j <= n; j++) dp[j] = j;
    for (let i = 1; i <= m; i++) {
      let prev = dp[0]; dp[0] = i;
      for (let j = 1; j <= n; j++) {
        const tmp = dp[j];
        dp[j] = Math.min(dp[j] + 1, dp[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
        prev = tmp;
      }
    }
    return dp[n];
  }
  function withinTolerance(h, t) {
    if (!h || !t) return false;
    if (h === t) return true;
    const dist = levenshtein(h, t);
    const tolerance = Math.max(1, Math.ceil(t.length * 0.4));
    return dist <= tolerance;
  }
  // Jamforde tidigare hela den normaliserade strangen (mellanslag borttagna)
  // rakt av mot maloret -- men taligenkanningen lagger ofta pa extra ljud
  // eller ord runt ett kort ord ("non" transkriberas som "non merci" etc),
  // och da fallerar hela strang-jamforelsen aven om malordet sades helt
  // ratt (ett anvandardtest visade att spelet horde och
  // skrev ut vad han sa, men registrerade det inte som ratt svar). Provar
  // darfor aven varje ordfonster i det som hordes, inte bara hela strangen.
  function fuzzyMatches(heard, target) {
    const t = normalizeForMatch(target);
    if (!t) return false;
    if (withinTolerance(normalizeForMatch(heard), t)) return true;
    const targetWordCount = Math.max(1, target.trim().split(/\s+/).length);
    const heardWords = heard.trim().split(/\s+/).filter(Boolean);
    for (let i = 0; i + targetWordCount <= heardWords.length; i++) {
      const windowNorm = normalizeForMatch(heardWords.slice(i, i + targetWordCount).join(''));
      if (withinTolerance(windowNorm, t)) return true;
    }
    return false;
  }

  // ================= Ljud & belonings-"juice" =================
  // Ett rakt "+10 XP"-flashmeddelande racker inte for att kansel som ett
  // spel snarare an ett lax-formular -- forskning pa motivation (variabel
  // beloning slar fast beloning, retrieval practice + omedelbar feedback
  // for flow) pekar pa att ljud/partiklar/combo-eskalering ar det som
  // faktiskt gor skillnaden, inte sjalva quiz-mekaniken. Se minnesfilen
  // for spelportal for resonemanget bakom detta (2026-08-08).
  const SOUND_KEY = 'ordmastaren-sound-v1';
  let soundOn = localStorage.getItem(SOUND_KEY) !== 'off';
  let audioCtx = null;
  function ensureAudioCtx() {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    if (!audioCtx) audioCtx = new Ctor();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function playTone(freq, duration, type, startOffset, peakGain) {
    if (!soundOn) return;
    const ctx = ensureAudioCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const t0 = ctx.currentTime + startOffset;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(peakGain, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.03);
  }
  function playCorrectSound(comboLevel) {
    const base = 494 + Math.min(comboLevel, 6) * 35; // tonhojden stiger nagot med kombon
    playTone(base, 0.11, 'sine', 0, 0.16);
    playTone(base * 1.5, 0.15, 'sine', 0.08, 0.13);
  }
  function playWrongSound() { playTone(150, 0.24, 'sine', 0, 0.13); }
  function playMasteredSound() {
    [523, 659, 784].forEach((f, i) => playTone(f, i === 2 ? 0.3 : 0.13, 'triangle', i * 0.1, 0.2));
  }
  function playSessionCompleteSound() {
    [523, 659, 784, 1046].forEach((f, i) => playTone(f, 0.2, 'triangle', i * 0.11, 0.18));
  }

  function spawnBurst(anchorEl, singleColor) {
    const rect = anchorEl.getBoundingClientRect();
    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    const colors = singleColor ? [singleColor] : ['#FFD23F', '#FF6EC7', '#2FE6D6', '#5CB85C'];
    for (let i = 0; i < 10; i++) {
      const p = document.createElement('div');
      p.className = 'burst-particle';
      p.style.background = colors[i % colors.length];
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      const angle = (Math.PI * 2 * i) / 10 + Math.random() * 0.4;
      const dist = 40 + Math.random() * 40;
      p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 650);
    }
  }

  // Enda stallet dar ett ratt svar belonas -- kombo-rakning ger variabel
  // (eskalerande) beloning istallet for ett fast +10 varje gang, och ett
  // ord som just blivit fardigt bemastrat (alla tre lagen) far en egen,
  // storre firande-banner eftersom DET ar det riktiga lardomsmalet, inte
  // bara "ratt pa en fraga".
  function celebrateCorrect(anchorEl, justMastered) {
    session.combo = (session.combo || 0) + 1;
    const bonus = 10 + Math.min(session.combo - 1, 6) * 3;
    awardXp(bonus);
    spawnBurst(anchorEl, justMastered ? '#FFD23F' : null);
    if (justMastered) {
      playMasteredSound();
      const banner = document.createElement('div');
      banner.className = 'mastery-banner';
      banner.textContent = '🏆 ORD BEMÄSTRAT! 🏆';
      document.body.appendChild(banner);
      setTimeout(() => banner.remove(), 1450);
    } else {
      playCorrectSound(session.combo);
      if (session.combo >= 2) {
        const pop = document.createElement('div');
        pop.className = 'combo-pop';
        pop.textContent = session.combo + 'x KOMBO! +' + bonus + ' XP';
        document.body.appendChild(pop);
        setTimeout(() => pop.remove(), 750);
      }
    }
  }
  function registerWrongAnswer() {
    session.combo = 0;
    playWrongSound();
  }

  // ================= UI-referenser =================
  const packView = document.getElementById('packView');
  const packGrid = document.getElementById('packGrid');
  const statRow = document.getElementById('statRow');
  const sessionView = document.getElementById('sessionView');
  const cardArea = document.getElementById('cardArea');
  const sessionBar = document.getElementById('sessionBar');
  const xpValEl = document.getElementById('xpVal');
  const backBtn = document.getElementById('backBtn');
  const summaryOverlay = document.getElementById('summaryOverlay');
  const summaryTitle = document.getElementById('summaryTitle');
  const summaryText = document.getElementById('summaryText');
  const summaryStars = document.getElementById('summaryStars');
  const playAgainBtn = document.getElementById('playAgainBtn');
  const backToPacksBtn = document.getElementById('backToPacksBtn');
  const soundToggle = document.getElementById('soundToggle');

  function updateSoundToggle() { soundToggle.textContent = soundOn ? '🔊' : '🔇'; }
  updateSoundToggle();
  soundToggle.addEventListener('click', () => {
    soundOn = !soundOn;
    localStorage.setItem(SOUND_KEY, soundOn ? 'on' : 'off');
    updateSoundToggle();
    if (soundOn) playCorrectSound(1);
  });

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ================= Paketval-vy =================
  function renderStats() {
    statRow.innerHTML =
      '<div class="stat-pill streak">🔥 dagar<span class="big">' + progress.streak.count + '</span></div>' +
      '<div class="stat-pill xp">⭐ XP<span class="big">' + progress.xp + '</span></div>' +
      '<div class="stat-pill words">📖 ord<span class="big">' + totalMasteredWords() + '/' + TOTAL_WORDS + '</span></div>';
  }

  function renderPackGrid() {
    packGrid.innerHTML = '';
    PACKS.forEach((pack, idx) => {
      const unlocked = isPackUnlocked(idx);
      const pct = packMasteryPct(idx);
      const stars = packStars(pct);
      const card = document.createElement('button');
      card.type = 'button';
      card.disabled = !unlocked;
      card.className = 'pack-card' + (unlocked ? '' : ' locked');
      card.setAttribute('aria-label', unlocked ? 'Starta paket ' + (idx + 1) + ': ' + pack.name : 'Paket ' + (idx + 1) + ' är låst');
      card.innerHTML =
        (unlocked ? '' : '<span class="lock-icon">🔒</span>') +
        '<span class="num">PAKET ' + (idx + 1) + '</span>' +
        '<span class="pack-title">' + pack.name + '</span>' +
        '<span class="bar-bg"><span class="bar-fill" style="width:' + Math.round(pct * 100) + '%"></span></span>' +
        '<span class="stars">' + '⭐'.repeat(stars) + '☆'.repeat(3 - stars) + '</span>';
      if (unlocked) card.addEventListener('click', () => startSession(idx));
      packGrid.appendChild(card);
    });
  }

  function showPackView() {
    sessionView.style.display = 'none';
    packView.style.display = 'block';
    renderStats();
    renderPackGrid();
  }

  // ================= Session-logik =================
  let session = null; // { packIdx, queue: [cards], cardIdx, correctCount, xpEarned }

  function buildSessionQueue(packIdx) {
    const words = PACKS[packIdx].words;
    const withState = words.map(w => ({ w, doneCount: wordDoneCount(w.fr) }));
    const fresh = shuffle(withState.filter(x => x.doneCount === 0));
    const partial = shuffle(withState.filter(x => x.doneCount > 0 && x.doneCount < 3));
    const mastered = shuffle(withState.filter(x => x.doneCount === 3));

    const modeOrder = ['read', 'listen', 'speak'];
    // Slumpar bland de lagen som saknas istallet for att alltid ta det
    // forsta ("lasa") -- annars blir en hel forsta session bara
    // las-uppgifter eftersom varje nytt ord har alla tre lagen kvar och
    // .find() alltid landar pa samma (hittades under testning 2026-08-08).
    // Forsta uppgiften for ett helt nytt ord slumpas dock bara mellan
    // lasa/lyssna (igenkanning) -- tala (aktiv produktion) sparas till
    // nasta gang ordet dyker upp.
    function nextMissingMode(fr) {
      const s = wordState(fr);
      const missing = modeOrder.filter(m => !s[m]);
      if (missing.length === 0) return modeOrder[Math.floor(Math.random() * 3)];
      if (missing.length === 3) {
        const recognitionModes = missing.filter(m => m !== 'speak');
        return recognitionModes[Math.floor(Math.random() * recognitionModes.length)];
      }
      return missing[Math.floor(Math.random() * missing.length)];
    }

    // Bygger kön i prioritetsordning: ord som redan pabörjats forst (for att
    // fardigstalla dem), sedan nya ord (introduktion + fråga), sedan repetition
    // av redan bemastrade ord. Om ett paket precis paborjats finns varken
    // "partial" eller "mastered" ord an -- da maste "fresh"-grenen ensam kunna
    // fylla hela sessionen, annars blir forsta sessionen alltid for kort
    // (hittades under testning 2026-08-08: sessionen tog bara 6 kort istallet
    // for SESSION_LEN eftersom fyllnadsloopen bara tittade i mastered/partial).
    const cards = [];
    let freshIdx = 0, partialIdx = 0, masteredIdx = 0, newIntroCount = 0;
    const MAX_NEW_PER_SESSION = 6;
    let guard = 0;
    while (cards.length < SESSION_LEN && guard++ < 500) {
      if (partialIdx < partial.length) {
        const x = partial[partialIdx++];
        cards.push({ type: nextMissingMode(x.w.fr), word: x.w });
        continue;
      }
      if (freshIdx < fresh.length && (newIntroCount < MAX_NEW_PER_SESSION || mastered.length === 0)) {
        const x = fresh[freshIdx++];
        cards.push({ type: 'intro', word: x.w });
        cards.push({ type: nextMissingMode(x.w.fr), word: x.w });
        newIntroCount++;
        continue;
      }
      if (mastered.length > 0) {
        const x = mastered[masteredIdx % mastered.length];
        masteredIdx++;
        cards.push({ type: modeOrder[Math.floor(Math.random() * 3)], word: x.w });
        continue;
      }
      break; // inget mer kvar att plocka fran (bor inte handa i ett 48-50-ords paket)
    }
    return cards;
  }

  function startSession(packIdx) {
    session = { packIdx, queue: buildSessionQueue(packIdx), cardIdx: 0, correctCount: 0, xpEarned: 0, combo: 0 };
    if (session.queue.length === 0) { showPackView(); return; }
    packView.style.display = 'none';
    sessionView.style.display = 'flex';
    xpValEl.textContent = progress.xp + ' XP';
    renderCurrentCard();
  }

  function updateSessionBar() {
    const pct = session.queue.length ? (session.cardIdx / session.queue.length) * 100 : 100;
    sessionBar.style.width = pct + '%';
  }

  function buildMcOptions(correctSv, packIdx) {
    const pool = PACKS[packIdx].words.map(w => w.sv).filter(sv => sv !== correctSv);
    const distractors = shuffle(pool).slice(0, 3);
    return shuffle([correctSv].concat(distractors));
  }

  function awardXp(n) {
    progress.xp += n;
    session.xpEarned += n;
    xpValEl.textContent = progress.xp + ' XP';
    saveProgress(progress);
  }

  function goToNextCard() {
    session.cardIdx++;
    updateSessionBar();
    if (session.cardIdx >= session.queue.length) {
      finishSession();
    } else {
      renderCurrentCard();
    }
  }

  function renderCurrentCard() {
    updateSessionBar();
    const card = session.queue[session.cardIdx];
    cardArea.innerHTML = '';
    if (card.type === 'intro') renderIntroCard(card);
    else if (card.type === 'read') renderReadCard(card);
    else if (card.type === 'listen') renderListenCard(card);
    else if (card.type === 'speak') renderSpeakCard(card);
  }

  function renderIntroCard(card) {
    const wrap = document.createElement('div');
    wrap.className = 'anim-in';
    wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:14px;';
    wrap.innerHTML =
      '<div class="mode-tag intro">NYTT ORD</div>' +
      '<div class="prompt-word">' + card.word.fr + '</div>' +
      '<div class="prompt-gloss">' + card.word.sv + '</div>' +
      '<button class="sound-btn" id="introSound">🔊</button>' +
      '<button class="continue-btn" id="introNext">Nästa &rarr;</button>';
    cardArea.appendChild(wrap);
    speak(card.word.fr);
    document.getElementById('introSound').addEventListener('click', () => speak(card.word.fr));
    document.getElementById('introNext').addEventListener('click', goToNextCard);
  }

  function renderReadCard(card) {
    const opts = buildMcOptions(card.word.sv, session.packIdx);
    const wrap = document.createElement('div');
    wrap.className = 'anim-in';
    wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;';
    wrap.innerHTML =
      '<div class="mode-tag read">LÄSA</div>' +
      '<div class="prompt-word">' + card.word.fr + '</div>' +
      '<div class="opt-grid" id="optGrid"></div>' +
      '<div class="feedback-flash" id="fb"></div>';
    cardArea.appendChild(wrap);
    const grid = document.getElementById('optGrid');
    opts.forEach(sv => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = sv;
      btn.addEventListener('click', () => handleMcAnswer(card, sv, grid, document.getElementById('fb')));
      grid.appendChild(btn);
    });
  }

  function renderListenCard(card) {
    const opts = buildMcOptions(card.word.sv, session.packIdx);
    const wrap = document.createElement('div');
    wrap.className = 'anim-in';
    wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;';
    wrap.innerHTML =
      '<div class="mode-tag listen">LYSSNA</div>' +
      '<button class="sound-btn" id="listenSound">🔊</button>' +
      '<div class="opt-grid" id="optGrid"></div>' +
      '<div class="feedback-flash" id="fb"></div>';
    cardArea.appendChild(wrap);
    speak(card.word.fr);
    document.getElementById('listenSound').addEventListener('click', () => speak(card.word.fr));
    const grid = document.getElementById('optGrid');
    opts.forEach(sv => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = sv;
      btn.addEventListener('click', () => handleMcAnswer(card, sv, grid, document.getElementById('fb')));
      grid.appendChild(btn);
    });
  }

  function handleMcAnswer(card, chosenSv, grid, fbEl) {
    if (grid.dataset.answered) return;
    grid.dataset.answered = '1';
    const ok = chosenSv === card.word.sv;
    [...grid.children].forEach(btn => {
      if (btn.textContent === card.word.sv) btn.classList.add('correct');
      else if (btn.textContent === chosenSv && !ok) btn.classList.add('wrong');
    });
    if (ok) {
      const justMastered = markWordMode(card.word.fr, card.type);
      saveProgress(progress);
      fbEl.className = 'feedback-flash ok';
      fbEl.textContent = justMastered ? 'Bemästrat! 🏆' : 'Rätt! 🎉';
      celebrateCorrect(grid, justMastered);
    } else {
      fbEl.className = 'feedback-flash no';
      fbEl.textContent = 'Rätt svar: ' + card.word.sv;
      grid.parentElement.classList.add('anim-shake');
      registerWrongAnswer();
    }
    setTimeout(goToNextCard, ok ? 900 : 1600);
  }

  function renderSpeakCard(card) {
    const wrap = document.createElement('div');
    wrap.className = 'anim-in';
    wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;';
    wrap.innerHTML =
      '<div class="mode-tag speak">TALA</div>' +
      '<div class="prompt-gloss">Hur säger man</div>' +
      '<div class="prompt-word" style="font-size:1.5rem;">' + card.word.sv + '</div>' +
      '<div class="prompt-gloss">på franska?</div>' +
      (speechRecoSupported
        ? '<button class="mic-btn" id="micBtn" aria-label="Starta mikrofonen">🎤</button><div class="heard-text" id="heardText"></div><button class="speak-fallback-btn" id="approveSpeechBtn" hidden>Jag sa ordet — godkänn ✅</button>'
        : '<button class="sound-btn" id="hintSound">🔊</button><div class="prompt-gloss">Säg ordet högt!</div><button class="speak-fallback-btn" id="saidBtn">Jag har sagt det! ✅</button>') +
      '<button class="sound-btn" id="hintBtn2" style="' + (speechRecoSupported ? '' : 'display:none;') + '">💡</button>' +
      '<button class="skip-btn" id="skipBtn">Hoppa över</button>' +
      '<div class="feedback-flash" id="fb"></div>';
    cardArea.appendChild(wrap);

    const fb = document.getElementById('fb');
    document.getElementById('skipBtn').addEventListener('click', () => setTimeout(goToNextCard, 0));

    let completed = false;
    function onSuccess(anchorEl) {
      if (completed) return;
      completed = true;
      const justMastered = markWordMode(card.word.fr, 'speak');
      saveProgress(progress);
      fb.className = 'feedback-flash ok';
      fb.textContent = justMastered ? 'Bemästrat! 🏆' : 'Rätt! 🎉';
      celebrateCorrect(anchorEl, justMastered);
      setTimeout(goToNextCard, 900);
    }

    if (speechRecoSupported) {
      const micBtn = document.getElementById('micBtn');
      const heardText = document.getElementById('heardText');
      const approveSpeechBtn = document.getElementById('approveSpeechBtn');
      document.getElementById('hintBtn2').addEventListener('click', () => speak(card.word.fr));
      approveSpeechBtn.addEventListener('click', () => onSuccess(approveSpeechBtn));
      let recognizing = false;
      let safetyTimer = null;
      function offerManualApproval(message) {
        approveSpeechBtn.hidden = false;
        if (message) heardText.textContent = message;
      }
      // Rensar alltid lyssnar-laget, oavsett vilken vag hit gick -- annars
      // kan mikrofonknappen fastna i "lyssnar"-laget for gott om webblasaren
      // av nagon anledning aldrig triggar onresult/onerror/onend (ett
      // anvandardtest gav pafunnet mikrofonlage utan resultat
      // 2026-08-08 -- mest sannolikt exakt detta: knappen var faktiskt
      // permanent upptagen efter forsta forsoket).
      function resetMic() {
        recognizing = false;
        micBtn.classList.remove('listening');
        if (safetyTimer) { clearTimeout(safetyTimer); safetyTimer = null; }
      }
      micBtn.addEventListener('click', () => {
        if (recognizing) return;
        recognizing = true;
        micBtn.classList.add('listening');
        heardText.textContent = 'Lyssnar... prata nu!';
        safetyTimer = setTimeout(() => {
          resetMic();
          offerManualApproval('Fick inget svar — testa igen eller godkänn själv.');
        }, 8000);
        const rec = new SpeechRecognitionCtor();
        rec.lang = 'fr-FR';
        rec.continuous = false;
        rec.interimResults = true;
        rec.maxAlternatives = 3;
        let heardAnyAudio = false;
        rec.onaudiostart = () => { heardAnyAudio = true; };
        rec.onspeechstart = () => { heardText.textContent = 'Hör dig...'; };
        rec.onresult = (e) => {
          const res = e.results[e.results.length - 1];
          if (!res.isFinal) { heardText.textContent = 'Hör: "' + res[0].transcript + '"...'; return; }
          heardText.textContent = 'Du sa: "' + res[0].transcript + '"';
          const alts = [];
          for (let i = 0; i < res.length; i++) alts.push(res[i].transcript);
          const match = alts.some(a => fuzzyMatches(a, card.word.fr));
          resetMic();
          if (match) onSuccess(micBtn);
          else {
            fb.className = 'feedback-flash no';
            fb.textContent = 'Taligenkänningen var osäker — försök igen eller godkänn själv.';
            offerManualApproval();
            registerWrongAnswer();
          }
        };
        rec.onerror = (e) => {
          resetMic();
          const messages = {
            'not-allowed': 'Mikrofonen är blockerad — tillåt mikrofonåtkomst i webbläsaren.',
            'service-not-allowed': 'Mikrofonen är blockerad — tillåt mikrofonåtkomst i webbläsaren.',
            'no-speech': 'Hördes ingenting — testa igen och prata direkt.',
            'audio-capture': 'Hittade ingen mikrofon.',
            'network': 'Nätverksfel — testa igen.'
          };
          if (messages[e.error]) heardText.textContent = messages[e.error];
          else if (e.error !== 'aborted') heardText.textContent = heardAnyAudio ? 'Kunde inte tolka — försök igen.' : 'Hördes ingenting — försök igen.';
          if (e.error !== 'aborted') offerManualApproval();
        };
        rec.onend = () => { resetMic(); };
        try { rec.start(); } catch (err) { resetMic(); heardText.textContent = 'Kunde inte starta mikrofonen — försök igen.'; }
      });
    } else {
      document.getElementById('hintSound').addEventListener('click', () => speak(card.word.fr));
      const saidBtn = document.getElementById('saidBtn');
      saidBtn.addEventListener('click', () => onSuccess(saidBtn));
    }
  }

  function finishSession() {
    bumpStreak();
    playSessionCompleteSound();
    const pct = packMasteryPct(session.packIdx);
    const stars = packStars(pct);
    summaryTitle.textContent = 'Bra jobbat!';
    summaryText.textContent = 'Du fick ' + session.xpEarned + ' XP i "' + PACKS[session.packIdx].name + '". Paketet är ' + Math.round(pct * 100) + '% bemästrat.';
    summaryStars.textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
    sessionView.style.display = 'none';
    summaryOverlay.classList.remove('hidden');
  }

  playAgainBtn.addEventListener('click', () => {
    summaryOverlay.classList.add('hidden');
    startSession(session.packIdx);
  });
  backToPacksBtn.addEventListener('click', () => {
    summaryOverlay.classList.add('hidden');
    showPackView();
  });
  backBtn.addEventListener('click', () => {
    window.FrenchSpeech?.stop();
    showPackView();
  });

  showPackView();
})();
</script>
